[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oppo-supermerge"
version = "0.1.0"
description = "Build a flashable super.img for OPPO / OnePlus / realme by merging an OTA payload.bin with EDL or .ofp packages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kpgc10kai" }]
keywords = ["android", "oppo", "oneplus", "realme", "super", "liblp", "ota", "payload", "edl", "ofp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
zstd = ["zstandard"]

[project.scripts]
supermerge = "supermerge:main"

[tool.setuptools]
py-modules = ["supermerge"]
packages = ["smlib"]

[tool.setuptools.package-data]
smlib = ["regions.json"]
