name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: self-test (synthetic payload / super / sparse fixtures)
        run: python tests/selftest.py

      - name: CLI smoke test
        run: python supermerge.py --help
